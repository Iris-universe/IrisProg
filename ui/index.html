<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src * data:; media-src * data:; frame-src 'self' about: data: https://open.spotify.com https://w.soundcloud.com https://www.youtube-nocookie.com https://www.youtube.com;">
  <title>IrisProg</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="nav">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#1463f3"/>
        <path d="M8 29h24M11 29V18l9-6 9 6v11" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M20 17.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z" fill="#9cc0ff"/>
      </svg>
      <div><b id="brand-name">IrisProg</b><span>Programmation</span></div>
    </div>
    <div id="countdown"></div>
    <button class="nv" data-act="nav" data-view="dashboard"></button>
    <button class="nv" data-act="nav" data-view="artists"></button>
    <button class="nv" data-act="nav" data-view="proposals"></button>
    <button class="nv" data-act="nav" data-view="timetable"></button>
    <button class="nv" data-act="nav" data-view="mail"></button>
    <div class="grow"></div>
    <div class="foot">
      <button class="nv" data-act="ask-orbiz"></button>
      <button class="nv" data-act="theme" id="theme-btn"></button>
      <button class="nv" data-act="nav" data-view="settings"></button>
    </div>
  </aside>
  <main id="view"></main>
  <section id="owa-pane" class="off"></section>
  <div class="scrim" id="scrim" data-act="close-drawer"></div>
  <aside class="drawer" id="drawer"></aside>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="jobs"></div>
  <div class="tip" id="tip" hidden></div>

  <script src="bridge.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="timetable.js"></script>
  <script src="mailui.js"></script>
  <script src="owa.js"></script>
  <script src="agent.js"></script>
</body>
</html>
